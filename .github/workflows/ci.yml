name: ci

on:
  push:
    branches: [main]
  # edited: PR 본문만 고쳐도 mr-lint가 다시 돈다. 다른 job도 같이 돈다(같은 커밋의 이전 실패를 skipped로 가리지 않는다)
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 단위 테스트
        run: python -m unittest discover tests -v

      - name: 자기 적용 드리프트 검사
        run: python bin/harness.py check --self

      # 빈 저장소에 키트를 붙여 돌아가는지 확인하는 리허설. hooks와 보안 검사 조각은 아래 rehearsal job에서
      # 같은 방식으로 만든 대상에 실제로 돌린다. 판정 스크립트(M2)도 같은 대상에 이어 붙인다.
      - name: 리허설 (GitLab + Jira)
        run: |
          target="$RUNNER_TEMP/rehearsal-gitlab"
          python bin/harness.py init "$target" --project-name rehearsal --platform gitlab --tracker jira --issue-prefix DEMO
          python bin/harness.py init "$target" --area backend --verify-cmd "./gradlew build"
          python bin/harness.py check "$target"
          test -f "$target/AGENTS.md"
          test -f "$target/backend/AGENTS.md"
          test -f "$target/.gitlab/merge_request_templates/Default.md"
          ! grep -R "{{" "$target" --include='*.md'

      - name: 리허설 (GitHub)
        run: |
          target="$RUNNER_TEMP/rehearsal-github"
          python bin/harness.py init "$target" --project-name rehearsal --platform github --tracker github --integration-branch main
          python bin/harness.py check "$target"
          test -f "$target/.github/PULL_REQUEST_TEMPLATE.md"

  # 리허설 대상에 hooks와 보안 검사 조각 4종을 실제로 돌린다(M1-8). 검출 시나리오는 종료 코드와 리포트의
  # 기대 ID를 함께 본다. Docker Hub·trivy DB·semgrep 레지스트리에 기대므로 필수 체크로 두지 않는다.
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: hooks 리허설
        run: python3 .github/scripts/rehearse.py hooks

      - name: 보안 검사 리허설
        run: python3 .github/scripts/rehearse.py security

  # 프로필별 리허설(M3-5). fixture 저장소에 프로필을 적용하고 scaffold → 영역 검증 명령(형식·컨벤션 테스트·lint·빌드)을
  # 저장소 루트에서 실행한다. 음성 시나리오는 컨벤션 테스트·lint가 실패해야 통과다. Maven Central·npm·Google Maven과
  # 러너의 Android SDK에 기대므로 필수 체크로 두지 않는다. 앞 프로필이 실패해도 뒤 프로필을 돌려 실패 위치를 모두 본다.
  # Gradle 캐시는 setup-java(actions/cache)로 둔다. setup-gradle은 MIT인 v5를 고정하고 자체 캐시는 끈다
  # (v6부터 캐시가 별도 약관 컴포넌트다).
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 같은 PR에서 새 실행(본문 수정 edited 포함)이 오면 앞 실행을 취소한다. 최대 45분짜리 job이 겹쳐 쌓이지 않게
    concurrency:
      group: profiles-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            tests/fixtures/profiles/**/*.gradle*
            tests/fixtures/profiles/**/libs.versions.toml

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          gradle-version: "8.14.3"
          cache-disabled: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/profiles/react-ts/frontend/package-lock.json

      - name: spring-java
        run: python3 .github/scripts/rehearse_profiles.py spring-java

      - name: react-ts
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/rehearse_profiles.py react-ts

      - name: android-kotlin
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/rehearse_profiles.py android-kotlin

  # 팀 대시보드 선택 조각(M5-8) 스모크. compose로 수집기·Prometheus·Loki·Grafana를 띄우고 키트 기록(telemetry push)과
  # Claude Code 형식 지표·이벤트를 보낸 뒤 대시보드의 모든 쿼리를 Grafana로 실행한다. 고정한 이미지 4개는 trivy로
  # HIGH·CRITICAL을 보고만 한다(차단하지 않음). Docker Hub·trivy DB에 기대므로 필수 체크로 두지 않는다.
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_FILE: core/observability/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 스택 기동
        run: |
          GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$GRAFANA_ADMIN_PASSWORD"
          echo "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" docker compose config --quiet
          GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" docker compose up -d

      - name: 스모크 검사
        run: python3 .github/scripts/observability_smoke.py

      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: 이미지 스캔 (trivy, 보고만)
        if: ${{ !cancelled() }}
        run: |
          for image in $(docker compose config --images); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --quiet --severity HIGH,CRITICAL --exit-code 0 --scanners vuln "$image"
          done

      - name: 정리
        if: always()
        run: docker compose down -v

  # PR 본문 필수 절 검사(M2-2). GitLab 조각(core/ci/gitlab/mr-lint.yml)과 같은 모듈을 원본에서 실행한다.
  # pull_request 이벤트만 쓴다(pull_request_target은 쓰지 않는다). PR이 바꾼 검사 코드가 쓰기 토큰과 함께 돌지 않게
  # lint(PR 코드, 읽기 전용, 토큰 없음)와 댓글(기준 커밋 코드, pull-requests: write)을 두 job으로 나눈다.
  mr-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 같은 PR의 synchronize·edited 실행이 겹치면 앞 실행을 취소한다
    concurrency:
      group: mr-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR 본문 lint
        run: python3 core/ci/mr-lint/mr_lint.py --no-comment --out mr-lint.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: mr-lint
          path: mr-lint.json
          retention-days: 30
          if-no-files-found: ignore

  # 판정 댓글(D-12, 선택). PR 체크 결과는 mr-lint job이 정하고 이 job은 실패하지 않는다. 기준 커밋을 checkout해
  # 신뢰하는 코드만 토큰과 함께 돌리고, PR 코드가 쓴 리포트는 검증한 필드만 댓글에 옮긴다. fork PR처럼 토큰이
  # 읽기 전용이면 경고만 낸다. 기준 커밋에 모듈이 없으면(이 job을 처음 들이는 PR) 경고하고 건너뛴다.
  mr-lint-comment:
    needs: mr-lint
    if: always() && github.event_name == 'pull_request' && (needs.mr-lint.result == 'success' || needs.mr-lint.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 같은 PR의 댓글 실행이 겹쳐 표식 댓글이 두 개 생기지 않게 앞 실행을 취소한다
    concurrency:
      group: mr-lint-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: mr-lint
          path: ${{ runner.temp }}/mr-lint

      - name: PR 본문 lint 댓글
        env:
          HARNESS_COMMENT_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f core/ci/mr-lint/mr_lint.py ]; then
            echo "::warning::기준 커밋에 core/ci/mr-lint/mr_lint.py가 없어 판정 댓글을 건너뛴다."
            exit 0
          fi
          python3 -I -B core/ci/mr-lint/mr_lint.py --post-report "$RUNNER_TEMP/mr-lint/mr-lint.json" || echo "::warning::판정 댓글 단계가 실패했다(lint 결과와 무관)."
