# OpenTelemetry Collector 설정(M5-8). Claude Code와 `harness telemetry push`의 OTLP를 받는다.
# 지표 → Prometheus 내보내기(:8889, prometheus.yml이 긁는다), 로그·이벤트 → Loki OTLP 수신(/otlp).
# 사람 구분(#127): 앞단 인증 프록시가 토큰으로 정해 넣는 `X-Harness-Member` 헤더를 리소스 속성 `member`로 옮긴다
# (README "팀 서버"). 헤더가 없으면 아무것도 하지 않는다. 프록시 없이 수집기를 직접 열면 누구나 헤더를 정할 수 있다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true   # 요청 헤더(gRPC 메타데이터)를 resource/member가 읽게 한다
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  batch: {}
  resource/member:      # 헤더 → 리소스 속성. batch가 요청 메타데이터를 버리므로 batch 앞에 둔다
    attributes:
      - key: member
        from_context: metadata.x-harness-member
        action: upsert   # 클라이언트가 OTEL_RESOURCE_ATTRIBUTES로 보낸 member는 프록시 값으로 덮는다
  deltatocumulative:   # Claude Code 지표 기본 temporality는 delta. Prometheus에는 누적으로 넣는다
    max_stale: 24h      # 기본 5분이면 잠시 조용한 세션의 누적이 0부터 다시 시작한다. 대시보드는 다시 시작도 이어 센다
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true   # service.name·team.id 같은 리소스 속성을 레이블로(팀·도구별로 나눠 본다)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/member, deltatocumulative, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/member, batch]
      exporters: [otlphttp/loki]
